buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        // react-native-webgpu (WebGPU Spatial stage) requires API 26; its native
        // module self-raises to 26, so the app must match or the manifest merge
        // fails. Drops Android 7.0/7.1. See docs + music_spatial_rn webgpu plan.
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Native Firebase: turns `google-services.json` into resources at
        // build time, and uploads Crashlytics mapping files.
        classpath("com.google.gms:google-services:4.5.0")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.8")
    }
}

apply plugin: "com.facebook.react.rootproject"
