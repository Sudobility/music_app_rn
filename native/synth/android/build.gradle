apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.moosiac.synth'
    compileSdk safeExtGet('compileSdkVersion', 35)
    // Match the app's pinned NDK (android/build.gradle's ext.ndkVersion).
    // Without this the module defaults to AGP's bundled NDK, which on this
    // machine is a partial install missing source.properties — CXX1101 at
    // configure. The fallback is the version build-fluidsynth-android.sh used.
    ndkVersion safeExtGet('ndkVersion', '27.1.12297006')

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 24)
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
        ndk {
            // The ABIs the prebuilt libfluidsynth.so is committed for
            // (build-fluidsynth-android.sh): arm64 for devices, x86_64 for the
            // emulator. An ABI without a FluidSynth library would fail the
            // module's CMake configure.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        // The soundfont is shared with the Apple bundle rather than copied: it
        // ships as an APK asset here (bundledSoundfontPath copies it out to a
        // real file the first time, since FluidSynth's sfload cannot read a
        // compressed asset in place).
        main {
            assets.srcDirs += ['../resources']
        }
    }

    // libfluidsynth.so is a prebuilt dependency, already built for release; its
    // debug symbols are not stripped again by this build.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
}
